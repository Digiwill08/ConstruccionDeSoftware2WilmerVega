spring.application.name=wilmer-vega
server.port=8085

# -------------------------------------------------------
# MySQL Database (transaccional)
# -------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3308/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# -------------------------------------------------------
# MongoDB Atlas (Bitacora / AuditLog - NoSQL)
# -------------------------------------------------------
# Define MONGODB_URI para Atlas o usa el valor local por defecto.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/bank_audit_db?connectTimeoutMS=5000&socketTimeoutMS=5000&serverSelectionTimeoutMS=5000}
spring.data.mongodb.database=${MONGODB_DATABASE:bank_audit_db}
app.mongodb.required=${MONGODB_REQUIRED:true}

# -------------------------------------------------------
# JWT Security
# CRITICAL: JWT_SECRET must be set via environment variable in production.
# For local development, if not set, a dev-only fallback is used (INSECURE - dev only).
# To set locally (PowerShell): $env:JWT_SECRET="your-secret-key"
# -------------------------------------------------------
jwt.secret=${JWT_SECRET:DEV_ONLY_INSECURE_SECRET_KEY_12345678901234567890123456789}
# JWT duration: 24 hours
jwt.expiration=24h
